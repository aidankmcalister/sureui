name: Bug report
description: Something in a SureUI component or the docs doesn't work as documented.
labels: [bug]
body:
  - type: dropdown
    id: item
    attributes:
      label: Item
      options:
        - confirm-button
        - confirm-menu-item
        - confirm-switch
        - type-to-confirm
        - confirm-dialog
        - confirm-popover
        - consequences
        - undo-toast
        - undoable
        - unsaved-changes
        - confirm-close
        - tool-approval
        - A block
        - The docs site
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code that shows it, or a link to a repo or sandbox.
      render: tsx
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, plus any screen reader or input device involved.
      placeholder: Chrome 140, macOS 26, VoiceOver
